spring:
  datasource:
    url: jdbc:mysql://mysql:3306/aiscanner?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai

  data:
    redis:
      host: redis

  flyway:
    baseline-on-migrate: true

ai:
  service:
    url: ${AI_SERVICE_URL:http://host.docker.internal:8001}

detect:
  video-storage-dir: /data/videos

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

